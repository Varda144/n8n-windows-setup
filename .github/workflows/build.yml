name: Build n8n setup.exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install original n8n (full frontend + backend)
        env:
          npm_config_build_from_source: "false"
        run: npm install --no-audit --no-fund

      - name: Verify full n8n package
        shell: pwsh
        run: |
          node -e "console.log(require('./node_modules/n8n/package.json').version)"
          if (!(Test-Path "node_modules/n8n/bin/n8n")) { throw "backend CLI missing: node_modules/n8n/bin/n8n" }
          if (!(Test-Path "node_modules/n8n-editor-ui/dist/index.html")) { throw "frontend dist missing: n8n-editor-ui/dist" }
          Write-Host "OK: backend CLI + frontend dist present"

      - name: Stage bundle (Node portable + n8n)
        shell: pwsh
        run: |
          $NodeVer = (node -v).TrimStart('v')
          $NodeZip = "node-v$NodeVer-win-x64.zip"
          $Url = "https://nodejs.org/dist/v$NodeVer/$NodeZip"
          Write-Host "Downloading $Url"
          Invoke-WebRequest -Uri $Url -OutFile $NodeZip
          Expand-Archive $NodeZip -DestinationPath node-dl
          # Use short root C:\n8n to avoid Windows 260-char path limit in Inno
          # (n8n node_modules has very deep pnpm paths, e.g. @langchain/.../.pnpm/...)
          $Stage = "C:\n8n"
          New-Item -ItemType Directory -Force -Path "$Stage\node" | Out-Null
          New-Item -ItemType Directory -Force -Path "$Stage\app" | Out-Null
          Copy-Item "node-dl\node-v$NodeVer-win-x64\*" "$Stage\node" -Recurse -Force
          # Prune Node portable to runtime-only (node.exe + DLLs). npm/npx not needed at runtime.
          Remove-Item -Recurse -Force "$Stage\node\node_modules" -ErrorAction SilentlyContinue
          Remove-Item -Force "$Stage\node\npm*", "$Stage\node\npx*", "$Stage\node\corepack*" -ErrorAction SilentlyContinue
          Copy-Item package.json "$Stage\app\package.json" -Force
          Copy-Item node_modules "$Stage\app\node_modules" -Recurse -Force
          Remove-Item -Recurse -Force "$Stage\app\node_modules\.cache" -ErrorAction SilentlyContinue
          node --version
          & "$Stage\node\node.exe" --version
          Write-Host "Bundle sizes:"
          "{0:N1} MB node" -f ((Get-ChildItem "$Stage\node" -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          "{0:N1} MB app" -f ((Get-ChildItem "$Stage\app" -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          # keep a repo-local copy marker for debugging (no full copy, saves disk/time)
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          "$Stage" | Out-File bundle/stage-path.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DStageRoot=C:\n8n" installer\n8n.iss > iscc.log 2>&1
          $code = $LASTEXITCODE
          Get-Content iscc.log -Tail 60
          if ($code -ne 0) { throw "ISCC failed with exit code $code (see tail above, full log: iscc.log)" }
          Get-ChildItem installer/Output/*.exe

      - name: Upload setup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-Setup-exe
          path: installer/Output/*.exe
